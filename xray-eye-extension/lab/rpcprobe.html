<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>rpc probe</title></head>
<body>
<!--
  lab/rpcprobe.html - drives the REAL page.js dispatch over the REAL
  CustomEvent transport, in a real browser.

  The preview harness answers panel commands from a fixture and the vm suite
  answers them from its own stub of the transport. Neither exercises page.js
  itself, so a command that is present in the file but not reachable through
  the dispatch passes both and fails in the extension. This page closes that
  gap: it loads quiet.js + engine.js + page.js exactly as the extension's
  executeScript does, and lets a test send commands the way the panel does.
-->
<pre id="out">loading...</pre>
<script src="/__src/quiet.js"></script>
<script src="/__src/engine.js"></script>
<script src="/__src/page.js"></script>
<script>
// The same transport the isolated-world relay uses.
const REQ = "__xrext_req__", RES = "__xrext_res__";
let seq = 0;
window.__call = function (cmd, args) {
  return new Promise(resolve => {
    const id = ++seq;
    let settled = false;
    const finish = d => { if (!settled) { settled = true; window.removeEventListener(RES, onRes); resolve(d); } };
    const onRes = ev => {
      let d = null;
      try { d = JSON.parse(ev.detail); } catch (_) { return; }
      if (!d || d.id !== id) return;
      finish(d);
    };
    window.addEventListener(RES, onRes, false);
    const timer = setTimeout(() => finish({ id, ok: false, error: "timeout after 12s" }), 12000);
    window.dispatchEvent(new CustomEvent(REQ, { detail: JSON.stringify({ id, cmd, args: args || {} }) }));
  });
};
window.__ready = true;
document.getElementById("out").textContent = "ready - use __call()";
document.title = "probe-ready";
</script>
</body>
</html>

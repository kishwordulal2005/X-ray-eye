<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>replica</title>
</head>
<body>
<!--
  lab/replica.html - the field-reported page, run exactly as the extension runs
  it: the page IS the error page, it makes no API calls at all, and the engine
  is booted afterwards rather than before.

  That last part matters. Opening the panel on an already-loaded page is the
  normal case, and it is the case that reported "nothing found" from the field.
  Nothing here makes an XHR, so every response-header and request-based
  detector has nothing to work with. Only the document pass can see anything.
-->
<pre id="out">running...</pre>
<script src="/__src/quiet.js"></script>
<script src="/__src/engine.js"></script>
<script>
(async () => {
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  try {
    await sleep(700);
    const s = xrayeye.securityAnalysis();
    const groups = ["headers", "leaks", "injection", "authz", "session"];
    let total = 0;
    const lines = [];
    for (const g of groups) {
      lines.push(g + " (" + s[g].length + ")");
      total += s[g].length;
      for (const f of s[g]) lines.push("  [" + f.severity + "/" + f.basis + "] " + f.title);
    }
    window.__replica = {
      endpoints: xrayeye.findings({}).length,
      coverage: s.coverage,
      total: total,
      counts: s.counts,
      limits: s.limits,
      leakIds: s.leaks.map(f => f.id),
      injectionIds: s.injection.map(f => f.id),
      summary: lines
    };
    document.getElementById("out").textContent = JSON.stringify(window.__replica, null, 2);
    document.title = "done:" + total;
  } catch (e) {
    window.__replica = { error: String((e && e.stack) || e) };
    document.title = "error";
  }
})();
</script>
</body>
</html>

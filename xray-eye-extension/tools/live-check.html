<!DOCTYPE html>
<!--
  tools/live-check.html — loads quiet.js, engine.js and page.js in page order,
  exactly as the extension's MAIN-world content script does, on a page that
  looks enough like a real site to make the scanner work.

  It exists to prove the scanner leaves the page alone. Nothing of x-ray-eye
  should be visible here — no corner panel, no badge, nothing injected. If
  anything appears, this page is wrong.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>target page — should be untouched by the scanner</title>
<style>
  body { font: 15px/1.6 system-ui, sans-serif; margin: 0; padding: 40px; background:#f6f7f9; color:#1a1d21; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color:#6b7280; font-size: 13px; margin-bottom: 24px; }
  .card { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:16px 18px; margin-bottom:14px; }
  code { background:#eef1f5; padding:1px 5px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>
  <h1>Demo Operations Console</h1>
  <div class="sub">A page that is meant to look completely untouched.</div>

  <div class="card">
    <strong>Session</strong>
    <p>Signed in as <code>ops.viewer@demo.example.test</code>.</p>
  </div>

  <div class="card">
    <strong>Recent activity</strong>
    <p id="rows">loading…</p>
  </div>

  <div class="card">
    <strong>Endpoints</strong>
    <p><code>GET /api/v1/users</code> · <code>GET /api/v1/orders</code> · <code>POST /api/v1/login</code></p>
  </div>

<script>
// A little traffic so the scanner has something to record, exactly as a real
  // SPA would. It all fails: the point is the page, not the responses.
  fetch("/api/v1/users?page=1").catch(() => {});
  fetch("/api/v1/orders").catch(() => {});
  document.getElementById("rows").textContent = "no rows";
</script>

<!-- The three scripts, in the order the extension injects them. Pointed at
     ../src so this page can never drift from what actually ships. -->
<script src="../src/quiet.js"></script>
<script src="../src/engine.js"></script>
<script src="../src/page.js"></script>

<script>
// Prove it to the console as well as to the eye, so a regression shows up in
// DevTools even when nobody is looking at the corner of the window.
setTimeout(function () {
  var injected = document.getElementById("__xrayeye_root");
  console.log("[live-check] injected UI nodes:",
    document.querySelectorAll("#__xrayeye_root").length,
    "| body children added by scanner:", injected ? "YES" : "none");
  document.title = document.title + (injected ? " — INJECTED (bad)" : " — clean");
}, 800);
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="x-ray-eye: passive browser-side attack-surface discovery for authorized security testing">
  <title>x-ray-eye</title>
  <desc>Passive browser-side attack-surface discovery for authorized security testing.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1119"/>
      <stop offset="55%" stop-color="#0e1620"/>
      <stop offset="100%" stop-color="#080d13"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1b2734" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)" opacity="0.55"/>
  <ellipse cx="430" cy="210" rx="330" ry="250" fill="url(#glow)"/>

  <!-- the eye: an iris made of a scan line -->
  <g transform="translate(112 132)">
    <ellipse cx="108" cy="78" rx="100" ry="66" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="108" cy="78" r="34" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.85"/>
    <circle cx="108" cy="78" r="15" fill="#38bdf8" opacity="0.22"/>
    <circle cx="108" cy="78" r="7" fill="#7dd3fc"/>
    <path d="M8 78h200" stroke="url(#accent)" stroke-width="1.6" opacity="0.45"/>
    <path d="M108 6v144" stroke="url(#accent)" stroke-width="1.2" opacity="0.22"/>
    <circle cx="108" cy="78" r="66" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
    <circle cx="108" cy="78" r="86" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.16"/>
  </g>

  <!-- the wordmark -->
  <g transform="translate(390 150)">
    <text x="0" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="62" font-weight="700" letter-spacing="-1.5" fill="#e8f0f7">x-ray<tspan fill="#7dd3fc">-eye</tspan></text>
    <text x="2" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="19" fill="#93a4b5">passive browser-side attack-surface discovery</text>
    <text x="2" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="15" fill="#5d6f80">for authorized security testing</text>
  </g>

  <!-- the read: a scan across a result table -->
  <g transform="translate(390 300)">
    <rect x="0" y="0" width="740" height="74" rx="8" fill="#0c141d" stroke="#1d2b39"/>
    <rect x="0.5" y="0.5" width="739" height="73" rx="7.5" fill="none" stroke="#243547" stroke-width="1"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <text x="18" y="26" fill="#64798c">ENDPOINT</text>
      <text x="238" y="26" fill="#64798c">STATE</text>
      <text x="352" y="26" fill="#64798c">WHAT</text>
      <text x="590" y="26" fill="#64798c">SEV</text>

      <text x="18" y="50" fill="#c7d6e2">/api/v1/users</text>
      <text x="238" y="50" fill="#4ade80">seen</text>
      <text x="352" y="50" fill="#93a4b5">IDOR candidate</text>
      <text x="590" y="50" fill="#fbbf24">MED</text>

      <text x="18" y="66" fill="#c7d6e2">/api/v1/orders</text>
      <text x="238" y="66" fill="#4ade80">seen</text>
      <text x="352" y="66" fill="#93a4b5">token in storage</text>
      <text x="590" y="66" fill="#f87171">HIGH</text>
    </g>
    <rect x="0" y="27" width="740" height="1" fill="#1d2b39"/>
    <rect x="0" y="14" width="740" height="26" fill="#38bdf8" opacity="0.05"/>
    <rect x="0" y="14" width="740" height="1.4" fill="#38bdf8" opacity="0.75"/>
    <rect x="0" y="39" width="740" height="0.8" fill="#38bdf8" opacity="0.3"/>
  </g>

  <!-- the promise -->
  <g transform="translate(390 398)">
    <rect x="0" y="-20" width="4" height="24" rx="2" fill="url(#warm)"/>
    <text x="16" y="-2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="15" fill="#b98a5e">no payload is ever sent &#183; nothing is probed without asking</text>
  </g>

  <!-- the maker -->
  <g transform="translate(1150 398)" text-anchor="end">
    <text x="0" y="-2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="14" fill="#4a5a6b">made by</text>
    <text x="0" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="15" font-weight="600" fill="#7dd3fc">unknonehart</text>
  </g>

  <!-- chrome frame hint -->
  <g opacity="0.5" transform="translate(1010 120)">
    <rect x="0" y="0" width="140" height="180" rx="10" fill="#0b1219" stroke="#22303f"/>
    <rect x="10" y="10" width="120" height="16" rx="5" fill="#131d27"/>
    <circle cx="20" cy="18" r="3" fill="#ef4444" opacity="0.6"/>
    <circle cx="31" cy="18" r="3" fill="#f59e0b" opacity="0.6"/>
    <circle cx="42" cy="18" r="3" fill="#22c55e" opacity="0.6"/>
    <rect x="10" y="36" width="120" height="134" rx="6" fill="#0e1620" stroke="#1a2530"/>
    <g fill="#223244">
      <rect x="18" y="46" width="64" height="6" rx="3"/>
      <rect x="18" y="60" width="96" height="6" rx="3"/>
      <rect x="18" y="74" width="48" height="6" rx="3"/>
      <rect x="18" y="96" width="104" height="20" rx="5"/>
      <rect x="18" y="124" width="78" height="6" rx="3"/>
      <rect x="18" y="138" width="58" height="6" rx="3"/>
    </g>
    <rect x="18" y="96" width="104" height="20" rx="5" fill="#38bdf8" opacity="0.16"/>
    <rect x="18" y="80" width="104" height="1.2" fill="#38bdf8" opacity="0.7"/>
  </g>
</svg>
